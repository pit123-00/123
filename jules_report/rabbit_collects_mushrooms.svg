<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background / Sky -->
  <rect width="800" height="600" fill="#87CEEB" />

  <!-- Grass -->
  <rect y="400" width="800" height="200" fill="#32CD32" />

  <!-- Sun -->
  <circle cx="100" cy="100" r="50" fill="#FFD700" />

  <!-- Clouds -->
  <path d="M 200 120 Q 220 90 250 120 Q 280 90 300 120 Q 320 120 320 140 L 200 140 Q 180 140 180 130 Q 180 120 200 120" fill="white" />
  <path d="M 500 150 Q 520 120 550 150 Q 580 120 600 150 Q 620 150 620 170 L 500 170 Q 480 170 480 160 Q 480 150 500 150" fill="white" />

  <!-- Trees (Background) -->
  <g transform="translate(50, 250)">
    <rect x="20" y="50" width="20" height="100" fill="#8B4513" />
    <polygon points="30,0 0,60 60,60" fill="#228B22" />
    <polygon points="30,-20 10,30 50,30" fill="#228B22" />
  </g>
  <g transform="translate(650, 200)">
    <rect x="20" y="50" width="20" height="150" fill="#8B4513" />
    <polygon points="30,0 -10,70 70,70" fill="#006400" />
    <polygon points="30,-30 0,30 60,30" fill="#006400" />
  </g>

  <!-- Basket -->
  <g transform="translate(420, 420)">
    <path d="M 0 0 L 10 40 L 60 40 L 70 0 Z" fill="#D2B48C" stroke="#8B4513" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 5 -5 C -10 -40 80 -40 65 -5" fill="none" stroke="#8B4513" stroke-width="4"/>
    <!-- Mushrooms in Basket -->
    <path d="M 15 0 Q 20 -15 30 0 Z" fill="#FF4500" />
    <path d="M 35 0 Q 40 -20 50 0 Z" fill="#FF4500" />
    <!-- Mushroom Stems -->
    <rect x="21" y="0" width="4" height="10" fill="#FFFAF0" />
    <rect x="41" y="0" width="4" height="10" fill="#FFFAF0" />
    <!-- Basket weaving lines -->
    <line x1="0" y1="10" x2="68" y2="10" stroke="#8B4513" stroke-width="1" />
    <line x1="2" y1="20" x2="65" y2="20" stroke="#8B4513" stroke-width="1" />
    <line x1="5" y1="30" x2="62" y2="30" stroke="#8B4513" stroke-width="1" />
  </g>

  <!-- Rabbit -->
  <g transform="translate(300, 380)">
    <!-- Ears -->
    <ellipse cx="20" cy="-20" rx="8" ry="30" fill="#FFFFFF" stroke="#D3D3D3" transform="rotate(-15 20 -20)" />
    <ellipse cx="60" cy="-20" rx="8" ry="30" fill="#FFFFFF" stroke="#D3D3D3" transform="rotate(15 60 -20)" />
    <ellipse cx="20" cy="-15" rx="4" ry="20" fill="#FFB6C1" transform="rotate(-15 20 -15)" />
    <ellipse cx="60" cy="-15" rx="4" ry="20" fill="#FFB6C1" transform="rotate(15 60 -15)" />

    <!-- Body -->
    <ellipse cx="50" cy="80" rx="45" ry="55" fill="#FFFFFF" stroke="#D3D3D3" />

    <!-- Head -->
    <ellipse cx="40" cy="20" rx="35" ry="30" fill="#FFFFFF" stroke="#D3D3D3" />

    <!-- Eyes -->
    <circle cx="25" cy="15" r="4" fill="#000000" />
    <circle cx="55" cy="15" r="4" fill="#000000" />

    <!-- Nose -->
    <circle cx="40" cy="25" r="3" fill="#FFB6C1" />

    <!-- Mouth -->
    <path d="M 35 30 Q 40 35 45 30" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Whiskers -->
    <line x1="10" y1="20" x2="-5" y2="15" stroke="#000000" stroke-width="1" />
    <line x1="10" y1="25" x2="-5" y2="25" stroke="#000000" stroke-width="1" />
    <line x1="70" y1="20" x2="85" y2="15" stroke="#000000" stroke-width="1" />
    <line x1="70" y1="25" x2="85" y2="25" stroke="#000000" stroke-width="1" />

    <!-- Arms -->
    <ellipse cx="10" cy="70" rx="8" ry="20" fill="#FFFFFF" stroke="#D3D3D3" transform="rotate(30 10 70)" />
    <ellipse cx="90" cy="65" rx="8" ry="20" fill="#FFFFFF" stroke="#D3D3D3" transform="rotate(-40 90 65)" />

    <!-- Legs -->
    <ellipse cx="20" cy="130" rx="15" ry="8" fill="#FFFFFF" stroke="#D3D3D3" />
    <ellipse cx="80" cy="130" rx="15" ry="8" fill="#FFFFFF" stroke="#D3D3D3" />

    <!-- Tail -->
    <circle cx="0" cy="110" r="12" fill="#FFFFFF" stroke="#D3D3D3" />
  </g>

  <!-- Mushrooms in the grass -->
  <g transform="translate(150, 480)">
    <rect x="8" y="10" width="8" height="20" fill="#FFFAF0" />
    <path d="M 0 10 Q 12 -10 24 10 Z" fill="#FF4500" />
    <!-- Spots -->
    <circle cx="6" cy="5" r="2" fill="white" />
    <circle cx="12" cy="2" r="1.5" fill="white" />
    <circle cx="18" cy="6" r="2" fill="white" />
  </g>

  <g transform="translate(600, 450)">
    <rect x="6" y="8" width="6" height="15" fill="#FFFAF0" />
    <path d="M 0 8 Q 9 -8 18 8 Z" fill="#8B4513" />
  </g>

  <g transform="translate(250, 430)">
    <rect x="10" y="12" width="10" height="25" fill="#FFFAF0" />
    <path d="M 0 12 Q 15 -15 30 12 Z" fill="#FF4500" />
    <!-- Spots -->
    <circle cx="8" cy="6" r="2.5" fill="white" />
    <circle cx="15" cy="3" r="2" fill="white" />
    <circle cx="22" cy="7" r="2.5" fill="white" />
  </g>

  <g transform="translate(550, 520)">
    <rect x="12" y="15" width="12" height="30" fill="#FFFAF0" />
    <path d="M 0 15 Q 18 -20 36 15 Z" fill="#FF4500" />
    <!-- Spots -->
    <circle cx="10" cy="8" r="3" fill="white" />
    <circle cx="18" cy="4" r="2.5" fill="white" />
    <circle cx="26" cy="9" r="3" fill="white" />
  </g>
</svg>